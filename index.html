<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il Riccio · Gestione Ruota (staff)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root{
    --red: #E5231B;
    --red-deep: #A81410;
    --red-bright: #F2402F;
    --teal: #23A69E;
    --teal-deep: #17716B;
    --cream: #FFF8EC;
    --white: #FFFFFF;
    --ink: #201613;
    --ink-soft: #5b4b45;
    --black: #171310;
    --gold: #EEC64B;
    --radius-card: 20px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height: 100vh;
    background: var(--red-deep);
  }

  body{
    font-family:'Poppins', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:flex-start;
    padding: 0 0 40px;
    background:
      radial-gradient(ellipse 100% 60% at 50% 0%, var(--red-bright) 0%, var(--red) 45%, var(--red-deep) 100%);
    position: relative;
    overflow-x:hidden;
  }

  .checker{
    width: 100%;
    height: 16px;
    background-image: repeating-conic-gradient(var(--black) 0% 25%, var(--white) 0% 50%);
    background-size: 16px 16px;
    flex-shrink: 0;
  }

  .stage{
    width: 100%;
    max-width: 560px;
    position: relative;
    z-index: 1;
    padding: 0 18px;
    margin-top: 26px;
  }

  .brand{
    text-align:center;
    margin-bottom: 22px;
  }

  .brand .logo{
    width: 128px;
    height: 128px;
    border-radius: 50%;
    border: 4px solid var(--cream);
    box-shadow: 0 14px 26px -10px rgba(0,0,0,0.55);
    margin-bottom: 14px;
    background: var(--red);
  }

  .brand .kicker{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing: 0.12em;
    font-size: 15px;
    color: var(--teal);
    background: var(--ink);
    display:inline-block;
    padding: 4px 14px;
    border-radius: 4px;
    margin: 0 0 10px;
  }

  .brand h1{
    font-family:'Pacifico', cursive;
    font-weight: 400;
    font-size: clamp(30px, 7.5vw, 42px);
    margin: 0;
    line-height: 1.1;
    color: var(--cream);
    text-shadow: 0 3px 0 var(--red-deep), 0 6px 14px rgba(0,0,0,0.35);
  }

  .nav{
    display:flex;
    justify-content:center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .nav a{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing: 0.04em;
    font-size: 14px;
    color: var(--cream);
    background: rgba(0,0,0,0.22);
    border: 2px solid var(--cream);
    padding: 8px 18px;
    border-radius: 999px;
    text-decoration: none;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }

  .nav a.active{
    background: var(--teal);
    border-color: var(--teal);
    color: var(--ink);
  }

  .nav a:hover{ border-color: var(--teal); }

  .card{
    background: var(--cream);
    border: 3px solid var(--ink);
    border-radius: var(--radius-card);
    padding: 30px 26px;
    box-shadow: 0 26px 50px -18px rgba(0,0,0,0.5);
    position: relative;
  }

  .card::before{
    content:"";
    position:absolute;
    top: -3px; left: -3px; right: -3px;
    height: 10px;
    background-image: repeating-linear-gradient(90deg, var(--teal) 0 18px, var(--teal-deep) 18px 36px);
    border-radius: var(--radius-card) var(--radius-card) 0 0;
  }

  .btn{
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 16px 20px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 19px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }

  .btn-primary{
    background: linear-gradient(180deg, var(--red-bright), var(--red) 60%, var(--red-deep));
    color: var(--cream);
    border: 2px solid var(--ink);
    box-shadow: 0 8px 0 var(--ink), 0 14px 22px -8px rgba(0,0,0,0.5);
  }

  .btn-primary:hover{ transform: translateY(-1px); }
  .btn-primary:active{ transform: translateY(3px); box-shadow: 0 4px 0 var(--ink), 0 8px 14px -8px rgba(0,0,0,0.5); }
  .btn-primary:disabled{ opacity: .4; cursor:not-allowed; transform:none; box-shadow: 0 8px 0 var(--ink); }

  .btn-ghost{
    background: var(--white);
    color: var(--teal-deep);
    border: 2px solid var(--teal);
    margin-top: 12px;
  }
  .btn-ghost:hover{ background: #eafbfa; }

  .btn-ghost.small{
    font-size: 13px;
    padding: 10px 14px;
    width: auto;
    display:block;
    margin: 14px auto 0;
  }

  .staff-toggle{
    display:block;
    margin: 18px auto 0;
    background:none;
    border:none;
    color: var(--ink-soft);
    opacity: 0.5;
    font-family:'Poppins', sans-serif;
    font-size: 12px;
    letter-spacing: 0.01em;
    cursor:pointer;
    text-align:center;
    padding: 6px;
    transition: opacity .15s ease, color .15s ease;
  }

  .staff-toggle:hover{ opacity: 0.95; color: var(--teal-deep); }

  .btn-danger-text{
    background:none;
    border:none;
    color: var(--red);
    font-size: 19px;
    line-height:1;
    cursor:pointer;
    padding: 6px 8px;
  }

  /* ---------- WHEEL ---------- */

  .wheel-area{
    position: relative;
    width: 290px;
    max-width: 100%;
    margin: 6px auto 22px;
    padding-top: 26px;
  }

  .pointer{
    position:absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 28px solid var(--ink);
    z-index: 5;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.35));
  }

  .pointer::after{
    content:"";
    position:absolute;
    top: -27px;
    left: -11px;
    width: 0;
    height: 0;
    border-left: 11px solid transparent;
    border-right: 11px solid transparent;
    border-top: 20px solid var(--gold);
  }

  .wheel-outer{
    position: relative;
    width: 290px;
    height: 290px;
    max-width: 100%;
    margin: 0 auto;
  }

  .wheel{
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 6px solid var(--ink);
    box-shadow: 0 16px 30px -10px rgba(0,0,0,0.5), inset 0 0 0 4px var(--cream);
    position: relative;
    transform: rotate(0deg);
    transition: transform 4.6s cubic-bezier(.15,.65,.1,1);
    will-change: transform;
    overflow: hidden;
  }

  .seg-label{
    position:absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    pointer-events:none;
  }

  .seg-label .txt{
    position:absolute;
    left: 0;
    font-family:'Bebas Neue', sans-serif;
    letter-spacing: 0.02em;
    color: var(--cream);
    text-shadow: 0 1px 2px rgba(0,0,0,0.45);
    white-space: nowrap;
    text-align: center;
  }

  .hub{
    position:absolute;
    top:50%;
    left:50%;
    width: 62px;
    height: 62px;
    margin: -31px 0 0 -31px;
    border-radius: 50%;
    background: var(--cream);
    border: 4px solid var(--ink);
    box-shadow: 0 6px 14px rgba(0,0,0,0.3);
    z-index: 4;
    overflow: hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .hub img{ width:100%; height:100%; object-fit:cover; }

  .spin-result{
    text-align:center;
    min-height: 30px;
    margin: 4px 0 4px;
    font-family:'Pacifico', cursive;
    font-size: 21px;
    color: var(--teal-deep);
  }

  /* ---------- RICHIESTE DI SBLOCCO ---------- */

  .req-panel{
    margin: 0 0 22px;
    padding-bottom: 18px;
    border-bottom: 2px dashed #e7d8c9;
  }
  .req-title{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing: 0.04em;
    font-size: 20px;
    color: var(--red-deep);
    margin: 0 0 4px;
    display:flex; align-items:center; gap:8px;
  }
  .req-badge{
    background: var(--red);
    color: var(--white);
    font-family:'Poppins', sans-serif;
    font-size: 12px; font-weight: 700;
    border-radius: 999px;
    padding: 1px 9px;
  }
  .req-badge[hidden]{ display:none; }
  .req-sub{ margin: 0 0 12px; font-size: 12.5px; color: var(--ink-soft); line-height:1.4; }
  .req-empty{
    text-align:center; padding: 16px 10px;
    font-size: 13.5px; color: var(--ink-soft);
    background: #faf5ee; border-radius: 12px;
  }
  .req-item{
    background: var(--white);
    border: 2px solid var(--gold);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
    animation: reqIn .35s ease both;
  }
  @keyframes reqIn{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform:none;} }
  .req-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .req-ig{
    font-weight: 700; font-size: 17px;
    color: var(--teal-deep);
    text-decoration: none; word-break: break-all;
  }
  .req-ig:hover{ text-decoration: underline; }
  .req-time{ font-size: 12px; color: var(--ink-soft); white-space:nowrap; }
  .req-warn{
    margin: 6px 0 0; font-size: 12px; font-weight: 600; color: var(--red-deep);
  }
  .req-actions{ display:flex; gap:10px; margin-top: 10px; }
  .req-btn{
    flex:1;
    font-family:'Poppins', sans-serif; font-weight: 600; font-size: 14px;
    border-radius: 10px; padding: 11px 10px; cursor:pointer;
    border: 2px solid var(--ink);
  }
  .req-btn.ok{ background: var(--teal); color: var(--white); }
  .req-btn.no{ background: var(--white); color: var(--red-deep); }
  .req-btn:disabled{ opacity:.45; cursor:not-allowed; }
  .req-msg{ min-height: 18px; margin: 6px 0 0; font-size: 12.5px; text-align:center; color: var(--ink-soft); }

  /* ---------- ADMIN PANEL ---------- */

  .admin-panel{
    margin-top: 22px;
    padding-top: 20px;
    border-top: 2px dashed #e7d8c9;
  }

  .admin-title{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing: 0.04em;
    font-size: 16px;
    color: var(--red-deep);
    margin: 0 0 14px;
  }

  .prize-row{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .prize-row input{
    background: var(--white);
    border: 2px solid #e7d8c9;
    border-radius: 10px;
    padding: 10px 12px;
    font-family:'Poppins', sans-serif;
    font-size: 14.5px;
    font-weight: 500;
    color: var(--ink);
  }

  .prize-row input:focus{ outline:none; border-color: var(--teal); }

  .prize-row{ flex-wrap: wrap; row-gap: 6px; }
  .prize-row .prize-name{ flex: 1 1 100%; min-width: 0; }
  .prize-row .prize-weight{ width: 58px; text-align:center; }
  .prize-row .prize-max{ width: 58px; text-align:center; }

  .prize-row .prize-pct{
    width: 40px;
    text-align:right;
    font-family:'Bebas Neue', sans-serif;
    font-size: 14px;
    color: var(--teal-deep);
    flex-shrink:0;
  }

  .prize-row .prize-count{
    width: 52px;
    text-align:center;
    font-size: 11.5px;
    color: var(--ink-soft);
    flex-shrink:0;
    line-height: 1.15;
  }

  .prize-row .field-label{
    font-size: 10px;
    color: var(--ink-soft);
    display:block;
    text-align:center;
    margin-bottom: 2px;
  }

  .prize-row .field-wrap{ display:flex; flex-direction:column; align-items:center; }

  .admin-hint{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 12px 2px 0;
  }

  .admin-actions{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content:center;
  }
  .admin-actions .btn-ghost.small{ margin: 14px 0 0; }

  @media (max-width: 420px){
    .card{ padding: 24px 18px; }
    .brand .logo{ width: 104px; height: 104px; }
    .wheel-area, .wheel-outer{ width: 250px; height: 250px; }
  }


  .staff-bar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin: 14px 0 4px;
  }
  .staff-bar .btn-ghost.small{ margin:0; }
  .staff-bar .btn-primary.small{
    padding: 10px 18px;
    font-size: 13px;
  }
  #salva-msg{
    text-align:center;
    font-size:12.5px;
    color: var(--teal-deep);
    min-height: 18px;
    margin-top: 6px;
  }
  .unsaved-dot{
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    background: var(--red);
    margin-left:6px;
    vertical-align:middle;
  }
</style>
</head>

<script>
(function(){

  // ==========================================================================
  // CONFIGURAZIONE — stesso URL del Web App usato in ruota-cliente.html
  // ==========================================================================
  const API_URL = 'https://script.google.com/macros/s/AKfycbyYtOVY6HBOkJd6XicVAVxs_FdRjw0YKKrbdjRHHgJWO4WeecOOT7IU5eZ1-etWANk/exec';

  // Chiave inviata in automatico con ogni azione dello staff: deve coincidere con
  // CHIAVE_STAFF in Codice.gs. Serve a impedire che dalla pagina cliente si possa
  // sbloccare da soli. Non pubblicare questo file.
  const STAFF_KEY = 'dc4baf8a23925aa18687487a';

  const PALETTE = ['#E5231B', '#23A69E', '#201613', '#A81410'];

  function uid(){
    return 'p_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
  }

  let prizes = [];        // stato locale in modifica (non ancora salvato)
  let unsaved = false;
  let currentRotation = 0;
  let spinning = false;

  const wheelEl = document.getElementById('wheel');
  const spinResultEl = document.getElementById('spin-result');
  const btnSpin = document.getElementById('btn-spin');
  const prizeListEl = document.getElementById('prize-list');
  const adminHintEl = document.getElementById('admin-hint');
  const btnAddPrize = document.getElementById('btn-add-prize');
  const btnSalva = document.getElementById('btn-salva');
  const btnRicarica = document.getElementById('btn-ricarica');
  const btnResetCounts = document.getElementById('btn-reset-counts');
  const salvaMsgEl = document.getElementById('salva-msg');
  const unsavedDot = document.getElementById('unsaved-dot');

  function nominalWeight(p){
    return Number(p.weight) > 0 ? Number(p.weight) : 0;
  }

  function effectiveWeight(p){
    const w = nominalWeight(p);
    const max = Number(p.maxCount) || 0;
    const c = Number(p.count) || 0;
    if (max > 0 && c >= max) return 0;
    return w;
  }

  function pct(w, total){
    if (!total) return '0%';
    return Math.round((w / total) * 100) + '%';
  }

  function markUnsaved(){
    unsaved = true;
    unsavedDot.hidden = false;
    salvaMsgEl.textContent = 'Modifiche non ancora salvate sul Google Sheet.';
  }

  function buildSegments(useEffective){
    const weightOf = useEffective ? effectiveWeight : nominalWeight;
    const total = prizes.reduce((sum, p) => sum + weightOf(p), 0);
    if (total <= 0){
      return { segments: [{ start:0, end:100, mid:50, color:'#c9bdb2', name:'Aggiungi un premio' }], total:0 };
    }
    let cum = 0;
    const segments = prizes.map((p, i) => {
      const w = weightOf(p);
      const pctv = (w / total) * 100;
      const start = cum;
      const end = cum + pctv;
      cum = end;
      return { start, end, mid:(start+end)/2, color: PALETTE[i % PALETTE.length], name: p.name || 'Premio', id: p.id };
    });
    return { segments, total };
  }

  function renderWheel(){
    const { segments } = buildSegments(false);

    const gradientParts = segments
      .filter(s => s.end > s.start)
      .map(s => `${s.color} ${s.start}% ${s.end}%`);
    wheelEl.style.background = `conic-gradient(${gradientParts.join(', ')})`;

    wheelEl.querySelectorAll('.seg-label').forEach(el => el.remove());

    const wheelSize = wheelEl.clientWidth || 278;
    const hubEl = document.querySelector('.hub');
    const hubR = (hubEl && hubEl.offsetWidth) ? hubEl.offsetWidth / 2 : 31;
    const rInner = hubR + 9;                            // il testo parte poco fuori dal mozzo...
    const rOuter = wheelSize / 2 - 9;                   // ...e arriva quasi al bordo
    const radius = (rInner + rOuter) / 2;               // centro del testo lungo il raggio
    const labelLength = Math.max(40, rOuter - rInner);  // spazio per ogni riga prima dei puntini
    const fontSize = segments.length > 8 ? 10 : segments.length > 5 ? 11.5 : 13;
    const lineH = fontSize * 1.1;

    segments.forEach(s => {
      if (s.end - s.start < 0.5) return;
      const midDeg = s.mid * 3.6;

      // Se il settore è abbastanza largo il nome va a capo (fino a 3 righe)
      // invece di troncarsi subito con i puntini di sospensione.
      const halfAngle = Math.min(((s.end - s.start) * 3.6 / 2) * Math.PI / 180, Math.PI / 3);
      const thickness = 2 * rInner * Math.tan(halfAngle) - 2;
      const lines = Math.max(1, Math.min(3, Math.floor(thickness / lineH)));

      const wrap = document.createElement('div');
      wrap.className = 'seg-label';
      wrap.style.transform = `rotate(${midDeg}deg)`;

      const txt = document.createElement('span');
      txt.className = 'txt';
      txt.textContent = s.name;
      txt.style.top = -radius + 'px';
      txt.style.width = labelLength + 'px';
      txt.style.fontSize = fontSize + 'px';
      txt.style.lineHeight = '1.1';
      txt.style.whiteSpace = 'normal';
      txt.style.overflowWrap = 'anywhere';
      txt.style.display = '-webkit-box';
      txt.style.setProperty('-webkit-box-orient', 'vertical');
      txt.style.setProperty('-webkit-line-clamp', String(lines));
      txt.style.overflow = 'hidden';
      txt.style.transform = 'translate(-50%, -50%) rotate(90deg)';

      wrap.appendChild(txt);
      wheelEl.appendChild(wrap);
    });
  }

  function renderAdmin(){
    const { total } = buildSegments(true);
    prizeListEl.innerHTML = '';

    prizes.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'prize-row';
      const max = Number(p.maxCount) || 0;
      const c = Number(p.count) || 0;
      const esaurito = max > 0 && c >= max;
      row.innerHTML = `
        <input type="text" class="prize-name" value="${(p.name || '').replace(/"/g,'&quot;')}" placeholder="Nome premio">
        <div class="field-wrap"><span class="field-label">Peso</span><input type="number" class="prize-weight" min="0" step="1" value="${Number(p.weight) || 0}"></div>
        <div class="field-wrap"><span class="field-label">Limite (0=∞)</span><input type="number" class="prize-max" min="0" step="1" value="${max}"></div>
        <span class="prize-pct">${pct(effectiveWeight(p), total)}</span>
        <span class="prize-count" style="${esaurito ? 'color:var(--red);font-weight:600;' : ''}">${max > 0 ? `${c}/${max}` : `${c} usciti`}</span>
        <button class="btn-danger-text" title="Rimuovi premio">✕</button>
      `;

      const nameInput = row.querySelector('.prize-name');
      const weightInput = row.querySelector('.prize-weight');
      const maxInput = row.querySelector('.prize-max');
      const removeBtn = row.querySelector('.btn-danger-text');

      nameInput.addEventListener('input', () => {
        prizes[i].name = nameInput.value;
        markUnsaved();
        renderWheel();
        refreshPct();
      });

      weightInput.addEventListener('input', () => {
        prizes[i].weight = weightInput.value === '' ? 0 : parseFloat(weightInput.value);
        markUnsaved();
        renderWheel();
        refreshPct();
      });

      maxInput.addEventListener('input', () => {
        const v = maxInput.value === '' ? 0 : parseInt(maxInput.value, 10);
        prizes[i].maxCount = (Number.isFinite(v) && v > 0) ? v : 0;
        markUnsaved();
        renderWheel();
        refreshPct();
        refreshCounts();
      });

      removeBtn.addEventListener('click', () => {
        prizes.splice(i, 1);
        markUnsaved();
        renderAdmin();
        renderWheel();
      });

      prizeListEl.appendChild(row);
    });

    adminHintEl.textContent = prizes.length
      ? 'Il peso decide le probabilità e la dimensione dei settori sulla ruota (fissa per i clienti). Il limite (0 = illimitato) esclude il premio dall\'estrazione una volta raggiunto, senza mai cambiare l\'aspetto della ruota.'
      : 'Aggiungi almeno un premio per attivare la ruota.';
  }

  function refreshPct(){
    const { total } = buildSegments(true);
    const pctEls = prizeListEl.querySelectorAll('.prize-pct');
    pctEls.forEach((el, i) => { el.textContent = pct(effectiveWeight(prizes[i]), total); });
  }

  function refreshCounts(){
    const countEls = prizeListEl.querySelectorAll('.prize-count');
    countEls.forEach((el, i) => {
      const p = prizes[i];
      const max = Number(p.maxCount) || 0;
      const c = Number(p.count) || 0;
      const esaurito = max > 0 && c >= max;
      el.textContent = max > 0 ? `${c}/${max}` : `${c} usciti`;
      el.style.color = esaurito ? 'var(--red)' : '';
      el.style.fontWeight = esaurito ? '600' : '';
    });
  }

  // --- Anteprima locale: la ruota gira e mostra un vincitore realistico
  // (rispettando i limiti), ma NON chiama mai il server: nessuna vincita
  // viene registrata. Serve solo a controllare come lo vedrà il cliente.
  function pickWinnerPreview(){
    const withPresence = prizes.filter(p => nominalWeight(p) > 0 && (p.name || '').trim());
    if (!withPresence.length) return null;
    let eligible = withPresence.filter(p => effectiveWeight(p) > 0);
    if (!eligible.length) eligible = withPresence;
    const totalW = eligible.reduce((s,p) => s + nominalWeight(p), 0);
    let r = Math.random() * totalW;
    for (const p of eligible){
      const w = nominalWeight(p);
      if (r < w) return p;
      r -= w;
    }
    return eligible[eligible.length - 1];
  }

  function spinPreview(){
    if (spinning) return;
    const chosen = pickWinnerPreview();
    if (!chosen){
      spinResultEl.textContent = 'Aggiungi almeno un premio con nome e probabilità.';
      return;
    }

    spinning = true;
    btnSpin.disabled = true;
    spinResultEl.textContent = '';

    const { segments } = buildSegments(false);
    const winner = segments.find(s => s.id === chosen.id) || segments[segments.length - 1];

    const span = winner.end - winner.start;
    const margin = Math.min(1.5, span / 4);
    const targetPct = span > 0
      ? winner.start + margin + Math.random() * Math.max(0.0001, span - 2 * margin)
      : winner.mid;
    const targetAngle = (targetPct / 100) * 360;

    const spins = 6;
    const deltaToAlign = ((360 - targetAngle) - (currentRotation % 360) + 360) % 360;
    currentRotation += spins * 360 + deltaToAlign;
    wheelEl.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
      spinning = false;
      btnSpin.disabled = false;
      spinResultEl.innerHTML = `Anteprima: sarebbe uscito <strong>${winner.name}</strong> (nessuna vincita registrata).`;
    }, 4700);
  }

  // Chiamata allo script con errori espliciti: così il messaggio a schermo dice
  // davvero cosa non va (rete/URL, risposta non JSON, errore dello script).
  async function chiamaApi(url, options){
    let res;
    try {
      res = await fetch(url, options);
    } catch (e){
      throw new Error('impossibile contattare lo script (URL errato, distribuzione non attiva o accesso non impostato su "Chiunque")');
    }
    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch (e){
      const anteprima = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140);
      throw new Error('risposta non valida da Apps Script (HTTP ' + res.status + '): ' + anteprima);
    }
    if (data && data.errore) throw new Error('lo script risponde: ' + data.errore);
    return data;
  }

  async function fetchStato(){
    const data = await chiamaApi(API_URL + '?action=stato');
    if (!Array.isArray(data.premi)) throw new Error('risposta senza elenco premi');
    return data.premi;
  }

  async function caricaDaServer(forzaSovrascrittura){
    if (unsaved && !forzaSovrascrittura){
      const ok = confirm('Hai modifiche non salvate: ricaricare dal Google Sheet le scarterà. Continuare?');
      if (!ok) return;
    }
    salvaMsgEl.textContent = 'Caricamento...';
    let premi;
    try {
      premi = await fetchStato();
    } catch (err){
      console.error('Caricamento premi fallito:', err);
      salvaMsgEl.textContent = 'Errore nel caricamento dal Google Sheet: ' + err.message;
      return;
    }
    prizes = premi;
    unsaved = false;
    unsavedDot.hidden = true;
    salvaMsgEl.textContent = 'Dati aggiornati dal Google Sheet.';
    renderAdmin();
    renderWheel();
  }

  async function salvaSuServer(){
    btnSalva.disabled = true;
    salvaMsgEl.textContent = 'Salvataggio in corso...';
    try {
      const data = await chiamaApi(API_URL, {
        method: 'POST',
        body: JSON.stringify({ azione: 'salvaPremi', premi: prizes, chiave: STAFF_KEY })
      });
      if (!data.ok) throw new Error('salvataggio non confermato');
      prizes = data.stato.premi;
      unsaved = false;
      unsavedDot.hidden = true;
      salvaMsgEl.textContent = 'Salvato ✓ — i clienti vedranno questi premi dal prossimo caricamento della pagina.';
      renderAdmin();
      renderWheel();
    } catch (err){
      console.error('Salvataggio fallito:', err);
      salvaMsgEl.textContent = 'Errore durante il salvataggio: ' + err.message;
    } finally {
      btnSalva.disabled = false;
    }
  }

  async function azzeraSuServer(){
    const ok = confirm('Azzerare i contatori di uscita di TUTTI i premi sul Google Sheet? L\'operazione non è reversibile.');
    if (!ok) return;
    salvaMsgEl.textContent = 'Azzeramento in corso...';
    try {
      const data = await chiamaApi(API_URL, {
        method: 'POST',
        body: JSON.stringify({ azione: 'azzeraContatori', chiave: STAFF_KEY })
      });
      if (!data.ok) throw new Error('azzeramento non confermato');
      await caricaDaServer(true);
      salvaMsgEl.textContent = 'Contatori azzerati ✓';
    } catch (err){
      console.error('Azzeramento fallito:', err);
      salvaMsgEl.textContent = 'Errore durante l\'azzeramento: ' + err.message;
    }
  }

  btnAddPrize.addEventListener('click', () => {
    prizes.push({ id: uid(), name: '', weight: 10, maxCount: 0, count: 0 });
    markUnsaved();
    renderAdmin();
    renderWheel();
    const inputs = prizeListEl.querySelectorAll('.prize-name');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });

  // ==========================================================================
  // RICHIESTE DI SBLOCCO
  // ==========================================================================
  const reqListEl = document.getElementById('req-list');
  const reqBadgeEl = document.getElementById('req-badge');
  const reqMsgEl = document.getElementById('req-msg');
  const REQ_POLL_MS = 4000;
  const TITOLO_BASE = document.title;
  let reqIds = null;        // id già visti (per accorgersi delle nuove richieste)
  let reqBusy = false;
  let audioCtx = null;

  // Il beep funziona solo dopo il primo tocco sulla pagina (regola dei browser).
  window.addEventListener('pointerdown', function(){
    try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }, { once: true });

  function beep(){
    try {
      if (!audioCtx) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.36);
    } catch(e){}
  }

  function etaTesto(iso){
    const sec = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    if (sec < 60) return 'ora';
    const min = Math.floor(sec / 60);
    if (min < 60) return min + ' min fa';
    return Math.floor(min / 60) + ' h fa';
  }

  async function chiamaStaff(azione, extra){
    const payload = Object.assign({ azione: azione, chiave: STAFF_KEY }, extra || {});
    return chiamaApi(API_URL, { method: 'POST', body: JSON.stringify(payload) });
  }

  function renderRichieste(lista){
    reqListEl.textContent = '';
    reqBadgeEl.hidden = lista.length === 0;
    reqBadgeEl.textContent = String(lista.length);
    document.title = (lista.length ? '(' + lista.length + ') ' : '') + TITOLO_BASE;

    if (!lista.length){
      const vuoto = document.createElement('div');
      vuoto.className = 'req-empty';
      vuoto.textContent = 'Nessuna richiesta in attesa.';
      reqListEl.appendChild(vuoto);
      return;
    }

    lista.forEach(function(r){
      const item = document.createElement('div');
      item.className = 'req-item';

      const top = document.createElement('div');
      top.className = 'req-top';
      const link = document.createElement('a');
      link.className = 'req-ig';
      link.textContent = '@' + r.instagram;
      link.href = 'https://www.instagram.com/' + encodeURIComponent(r.instagram) + '/';
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      const tempo = document.createElement('span');
      tempo.className = 'req-time';
      tempo.textContent = etaTesto(r.creatoIl);
      top.appendChild(link);
      top.appendChild(tempo);
      item.appendChild(top);

      if (r.giaPartecipato){
        const warn = document.createElement('p');
        warn.className = 'req-warn';
        warn.textContent = '⚠️ Questo account ha già girato la ruota.';
        item.appendChild(warn);
      }

      const azioni = document.createElement('div');
      azioni.className = 'req-actions';
      const ok = document.createElement('button');
      ok.className = 'req-btn ok';
      ok.type = 'button';
      ok.textContent = '✅ Sblocca';
      const no = document.createElement('button');
      no.className = 'req-btn no';
      no.type = 'button';
      no.textContent = '✕ Rifiuta';
      ok.addEventListener('click', function(){ decidi(r.id, true, ok, no); });
      no.addEventListener('click', function(){ decidi(r.id, false, ok, no); });
      azioni.appendChild(ok);
      azioni.appendChild(no);
      item.appendChild(azioni);

      reqListEl.appendChild(item);
    });
  }

  async function aggiornaRichieste(){
    if (reqBusy) return;
    reqBusy = true;
    try {
      const data = await chiamaStaff('listaRichieste');
      if (!Array.isArray(data.richieste)) throw new Error('risposta senza elenco richieste');
      const lista = data.richieste;
      const nuove = reqIds !== null && lista.some(function(r){ return reqIds.indexOf(r.id) === -1; });
      reqIds = lista.map(function(r){ return r.id; });
      renderRichieste(lista);
      if (nuove) beep();
      if (reqMsgEl.dataset.errore === '1'){ reqMsgEl.textContent = ''; reqMsgEl.dataset.errore = ''; }
    } catch (err){
      console.error('Aggiornamento richieste fallito:', err);
      reqMsgEl.textContent = 'Richieste non aggiornate: ' + err.message;
      reqMsgEl.dataset.errore = '1';
    } finally {
      reqBusy = false;
    }
  }

  async function decidi(id, sblocca, btnOk, btnNo){
    btnOk.disabled = true;
    btnNo.disabled = true;
    reqMsgEl.textContent = sblocca ? 'Sblocco in corso...' : 'Rifiuto in corso...';
    reqMsgEl.dataset.errore = '';
    try {
      await chiamaStaff(sblocca ? 'sblocca' : 'rifiuta', { id: id });
      reqMsgEl.textContent = sblocca ? 'Cliente sbloccato ✓' : 'Richiesta rifiutata.';
    } catch (err){
      console.error('Decisione fallita:', err);
      reqMsgEl.textContent = 'Errore: ' + err.message;
    }
    reqBusy = false;
    await aggiornaRichieste();
  }

  setInterval(function(){ if (!document.hidden) aggiornaRichieste(); }, REQ_POLL_MS);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) aggiornaRichieste(); });

  btnSpin.addEventListener('click', spinPreview);
  btnSalva.addEventListener('click', salvaSuServer);
  btnRicarica.addEventListener('click', () => caricaDaServer(false));
  btnResetCounts.addEventListener('click', azzeraSuServer);
  window.addEventListener('resize', renderWheel);

  window.addEventListener('beforeunload', (e) => {
    if (unsaved){ e.preventDefault(); e.returnValue = ''; }
  });

  (async function init(){
    if (API_URL.indexOf('INCOLLA_QUI') !== -1){
      salvaMsgEl.textContent = 'Configurazione mancante: imposta API_URL nel file.';
      return;
    }
    aggiornaRichieste();
    await caricaDaServer(true);
  })();

})();
</script>
</body>
